---
- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_user }}"
    system: true
    state: present

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Check current installed node_exporter version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_current
  failed_when: false
  changed_when: false

- name: Download node_exporter archive
  ansible.builtin.command: >
    curl -fsSL -o /tmp/node_exporter-{{ node_exporter_version }}.tar.gz
    https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ go_arch }}.tar.gz
  args:
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
  when: node_exporter_version not in node_exporter_current.stdout | default('')

- name: Create node_exporter install dir
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_version not in node_exporter_current.stdout | default('')

- name: Extract node_exporter archive
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
  when: node_exporter_version not in node_exporter_current.stdout | default('')

- name: Install node_exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: "{{ node_exporter_install_dir }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_version not in node_exporter_current.stdout | default('')
  notify: restart node_exporter

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true