---
- name: Create prometheus system group
  ansible.builtin.group:
    name: "{{ prometheus_user }}"
    system: true
    state: present

- name: Create prometheus system user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0755"
  loop:
    - "{{ prometheus_install_dir }}"
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_data_dir }}"

- name: Check current installed prometheus version
  ansible.builtin.command: /usr/local/bin/prometheus --version
  register: prometheus_current
  failed_when: false
  changed_when: false

- name: Download prometheus archive
  ansible.builtin.command: >
    curl -fsSL -o /tmp/prometheus-{{ prometheus_version }}.tar.gz
    https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ go_arch }}.tar.gz
  args:
    creates: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
  when: prometheus_version not in (prometheus_current.stdout | default('')) + (prometheus_current.stderr | default(''))

- name: Extract prometheus archive
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: "{{ prometheus_install_dir }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
  when: prometheus_version not in (prometheus_current.stdout | default('')) + (prometheus_current.stderr | default(''))

- name: Install prometheus binaries to /usr/local/bin
  ansible.builtin.copy:
    src: "{{ prometheus_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool
  when: prometheus_version not in (prometheus_current.stdout | default('')) + (prometheus_current.stderr | default(''))
  notify: restart prometheus

- name: Copy prometheus console libraries
  ansible.builtin.copy:
    src: "{{ prometheus_install_dir }}/{{ item }}"
    dest: "{{ prometheus_config_dir }}/{{ item }}"
    remote_src: true
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0755"
  loop:
    - consoles
    - console_libraries
  when: prometheus_version not in (prometheus_current.stdout | default('')) + (prometheus_current.stderr | default(''))

- name: Deploy prometheus.yml scrape config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0644"
  notify: restart prometheus

- name: Deploy prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus

- name: Set ownership on prometheus data dir
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    recurse: true

- name: Enable and start prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true